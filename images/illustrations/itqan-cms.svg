<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Conceptual API and content publishing dashboard for Quranic resources">
<title>Conceptual API and content publishing dashboard for Quranic resources</title>
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132e30"/><stop offset="1" stop-color="#1b4a49"/></linearGradient>
<linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="19" flood-color="#020617" flood-opacity=".25"/></filter>
<pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#ffffff" opacity=".1"/></pattern>
</defs>
<rect width="1200" height="750" fill="url(#background)"/>
<rect width="1200" height="750" fill="url(#dots)"/>
<circle cx="1050" cy="90" r="310" fill="#e7c68b" opacity=".11"/>
<circle cx="130" cy="760" r="285" fill="#e7c68b" opacity=".09"/>
<g filter="url(#shadow)"><rect x="110" y="94" width="980" height="567" rx="22" fill="#102428" stroke="none"/><rect x="110" y="94" width="980" height="64" rx="22" fill="#1d3d41" stroke="none"/></g>
<text x="150" y="137" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#e3cd9b" >ITQAN / CONTENT API</text>
<rect x="156" y="204" width="434" height="392" rx="16" fill="#17343a" stroke="#3a6464"/>
<text x="182" y="254" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#91babc" >RESOURCE LIBRARY</text>
<rect x="180" y="288" width="387" height="63" rx="10" fill="#27474b" stroke="none"/><text x="200" y="327" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#e7f3e9" >Quranic texts</text><rect x="480" y="303" width="63" height="32" rx="7" fill="#317965" stroke="none"/><text x="490" y="324" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#ecfdf5" >ACTIVE</text>
<rect x="180" y="373" width="387" height="64" rx="10" fill="#27474b" stroke="none"/><text x="200" y="413" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#e7f3e9" >Audio resources</text>
<rect x="180" y="458" width="387" height="63" rx="10" fill="#27474b" stroke="none"/><text x="200" y="499" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#e7f3e9" >Metadata / versions</text>
<text x="648" y="223" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#fff1d5" >Developer API</text>
<text x="648" y="263" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#a2c6c3" >Curated content, built to integrate.</text>
<rect x="646" y="295" width="387" height="217" rx="14" fill="#091b1f" stroke="#436565"/>
<text x="668" y="336" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#7de4b6" >GET</text><text x="730" y="336" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#d5e8e4" >/api/v1/resources</text>
<line x1="665" y1="353" x2="1011" y2="353" stroke="#406064" stroke-width="2" stroke-linecap="round"/>
<text x="670" y="393" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#a9ddbb" >{ &quot;status&quot;: &quot;ok&quot;,</text>
<text x="686" y="428" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#d6bc91" >&quot;items&quot;: 128,</text>
<text x="686" y="463" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#d6bc91" >&quot;version&quot;: &quot;1.0&quot; }</text>
<rect x="650" y="547" width="381" height="65" rx="10" fill="#245b50" stroke="none"/><text x="681" y="589" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#e5fbec" >ACCESS GRANTED    200 OK</text>
</svg>