name: Portfolio visual QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/style.css"
      - "js/animations.js"
      - ".github/workflows/portfolio-visual-qa.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-visual-qa
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Render desktop and mobile
        run: |
          python - <<'PY'
          import asyncio, pathlib
          from playwright.async_api import async_playwright
          async def main():
              url = pathlib.Path("index.html").resolve().as_uri()
              pathlib.Path("qa-artifacts").mkdir(exist_ok=True)
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  for label,width,height in [("desktop",1440,900),("mobile",390,844)]:
                      page = await browser.new_page(viewport={"width":width,"height":height},device_scale_factor=1)
                      await page.goto(url,wait_until="load",timeout=40000)
                      # Test the *real* hero animation before adding any QA override CSS.
                      await page.wait_for_timeout(2500)
                      headline = await page.evaluate("""() => {
                          const words = [...document.querySelectorAll('#hero-title .hero-word')];
                          return {
                              gsap: !!window.gsap,
                              words: words.map(word => {
                                  const mask = word.closest('.hero-word-mask');
                                  const w = word.getBoundingClientRect();
                                  const m = mask.getBoundingClientRect();
                                  const visible = Math.max(0, Math.min(w.bottom,m.bottom) - Math.max(w.top,m.top));
                                  return {text:word.textContent,opacity:getComputedStyle(word).opacity,
                                          inFrame: w.height ? visible/w.height : 0,
                                          transform:getComputedStyle(word).transform};
                              })
                          };
                      }""")
                      assert headline['words'], f"{label}: headline words missing"
                      failures = [w for w in headline['words'] if float(w['opacity']) < .99 or w['inFrame'] < .82]
                      assert not failures, f"{label}: hero words hidden after animation (GSAP={headline['gsap']}): {failures}"
                      print(f"{label}: {len(headline['words'])} words visible after hero animation, GSAP={headline['gsap']}")
                      await page.add_style_tag(content="*{animation:none!important;transition:none!important} .hero-fade-up,.scroll-reveal,.fade-in,.hero-word{opacity:1!important;transform:none!important;visibility:visible!important}")
                      await page.wait_for_timeout(500)
                      await page.screenshot(path=f"qa-artifacts/{label}-hero.png",animations="disabled")
                      await page.locator("#projects").scroll_into_view_if_needed()
                      await page.wait_for_timeout(250)
                      await page.screenshot(path=f"qa-artifacts/{label}-projects.png",animations="disabled")
                      # Validate the additional gallery, not just featured case studies.
                      gallery_card = page.locator(".additional-projects-grid .project-card:not(.spotlight-project)").first
                      await gallery_card.scroll_into_view_if_needed()
                      image = gallery_card.locator(":scope > .project-card-img, :scope > .project-illustration, :scope > .project-live-preview")
                      await image.locator("img").evaluate("(img) => img.decode().catch(() => {})")
                      await page.wait_for_timeout(350)
                      card_box, image_box = await gallery_card.bounding_box(), await image.bounding_box()
                      assert card_box and image_box, f"{label}: missing gallery or image"
                      fraction = image_box["width"] / card_box["width"]
                      assert fraction >= 0.94, f"{label}: preview too narrow: {fraction:.2f}"
                      ratio = image_box["width"] / image_box["height"]
                      assert 1.48 <= ratio <= 1.72, f"{label}: wrong preview aspect ratio: {ratio:.2f}"
                      await page.screenshot(path=f"qa-artifacts/{label}-gallery.png",animations="disabled")
                      print(f"{label}: project image width={fraction:.2%} of card, ratio={ratio:.2f}")
                      await page.close()
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-visual-qa
          path: qa-artifacts/*.png
          retention-days: 2
