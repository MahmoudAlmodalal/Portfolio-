name: Capture Souqi Market interfaces

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/souqi-screenshots.yml"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: MahmoudAlmodalal/Market
          path: souqi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app
        run: |
          cd souqi
          npm ci --no-audit --no-fund
      - name: Start Next development server
        run: |
          cd souqi
          NEXT_TELEMETRY_DISABLED=1 PORT=3210 npm run dev -- --hostname 127.0.0.1 > /tmp/souqi-next.log 2>&1 &
          echo $! > /tmp/souqi-next.pid
          for i in $(seq 1 100); do
            if curl --silent --fail --max-time 4 http://127.0.0.1:3210/ar > /dev/null; then
              echo "Souqi frontend is ready"
              break
            fi
            sleep 3
          done
          curl --fail --max-time 25 -I http://127.0.0.1:3210/ar || (tail -c 4000 /tmp/souqi-next.log; exit 1)
      - name: Install Playwright
        run: |
          python -m pip install "playwright==1.56.0" "Pillow==11.3.0"
          python -m playwright install --with-deps chromium
      - name: Capture original Souqi UI
        run: |
          python - <<'PY'
          import asyncio, json, os, pathlib
          from playwright.async_api import async_playwright
          BASE='http://127.0.0.1:3210'
          shots=[
            ('01-home-desktop','/ar',1440,900),
            ('02-catalog-desktop','/ar/catalog',1440,900),
            ('03-product-desktop','/ar/products/1',1440,900),
            ('04-home-mobile','/ar',390,844),
            ('05-catalog-mobile','/ar/catalog',390,844),
            ('06-product-mobile','/ar/products/1',390,844),
            ('07-cart-mobile','/ar/cart',390,844),
            ('08-login-mobile','/ar/login',390,844),
            ('09-seller-login','/ar/seller/dashboard',1440,900),
          ]
          async def main():
            out=pathlib.Path('souqi-screenshots')
            out.mkdir(parents=True,exist_ok=True)
            results=[]
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for name,route,width,height in shots:
                page=await b.new_page(viewport={'width':width,'height':height},device_scale_factor=1,locale='ar-PS',is_mobile=width<=390,has_touch=width<=390)
                try:
                  response=await page.goto(BASE+route,wait_until='domcontentloaded',timeout=60000)
                  if not response or response.status>=400:
                    print(f'SKIP {name}: HTTP {response.status if response else "missing"}',flush=True)
                    continue
                  try: await page.wait_for_load_state('networkidle',timeout=8500)
                  except: pass
                  try: await page.evaluate('document.fonts.ready')
                  except: pass
                  await page.wait_for_timeout(1000)
                  body=await page.locator('body').inner_text()
                  if len(body.strip())<40 or 'Application error' in body or 'Internal Server Error' in body: 
                    print(f'SKIP {name} insufficient page content',flush=True)
                    continue
                  fn=out/(name+'.png')
                  await page.screenshot(path=str(fn),animations='disabled',full_page=False)
                  results.append({'name':fn.name,'route':route,'size':f'{width}x{height}','title':await page.title()})
                  print(f'CAPTURE {fn.name}: {len(body)} chars, {await page.title()}',flush=True)
                except Exception as e:
                  print(f'SKIP {name}: {type(e).__name__} {str(e)[:180]}',flush=True)
                finally: await page.close()
              await b.close()
            (out/'metadata.json').write_text(json.dumps({'source_repo':'https://github.com/MahmoudAlmodalal/Market','basis':'screenshots of local Next.js UI with mock demo data; not live public deployment','screens':results},ensure_ascii=False,indent=2),encoding='utf-8')
            print(f'CAPTURED {len(results)}',flush=True)
            if len(results)<3: raise RuntimeError('Not enough UI pages rendered')
          asyncio.run(main())
          PY
      - name: Upload Souqi screenshots
        uses: actions/upload-artifact@v4
        with:
          name: souqi-market-source-ui-screenshots
          path: souqi-screenshots/
          retention-days: 3
      - name: Failure diagnostics
        if: failure()
        run: tail -c 8000 /tmp/souqi-next.log || true
