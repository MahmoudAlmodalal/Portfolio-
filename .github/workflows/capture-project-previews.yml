name: Capture authentic project previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-project-previews.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-live-preview-capture
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.56.0" "pillow==11.3.0"
          python -m playwright install --with-deps chromium

      - name: Capture deployed websites
        run: python scripts/capture_live_previews.py

      - name: Commit successful captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/live/
          if git diff --cached --quiet; then
            echo "No successful captures to commit"
          else
            git commit -m "Add authentic screenshots from live project websites"
            git push origin HEAD:main
          fi
